<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>راهنمای آلمان — Wegweiser</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- LANGUAGE — shown only when more than one language is configured and
         none has been chosen yet. Each option is written in its own script and
         its own direction; no shared language is assumed. -->
    <main id="screen-language" class="screen" hidden>
      <div id="language-list" class="language-list"></div>
    </main>

    <!-- HOME -->
    <main id="screen-home" class="screen" hidden>
      <header class="home-header">
        <p id="kicker" class="kicker"></p>
        <p id="guide-label" class="guide-label"></p>
      </header>

      <button id="mic" class="mic" type="button" hidden>
        <span class="mic-glyph" aria-hidden="true">🎙️</span>
        <span id="mic-label" class="mic-label"></span>
      </button>

      <nav id="grid" class="grid"></nav>
    </main>

    <!-- TOPIC -->
    <main id="screen-topic" class="screen" hidden>
      <button id="back" class="back" type="button">
        <span aria-hidden="true">→</span>
      </button>
      <div id="topic-content"></div>
    </main>

    <!-- VOICE OVERLAY -->
    <div id="voice-overlay" class="voice" hidden data-state="listening" role="dialog" aria-modal="true">
      <button id="voice-close" class="voice-close" type="button">
        <span aria-hidden="true">✕</span>
      </button>
      <div class="voice-stage" aria-hidden="true">
        <span class="voice-glyph voice-mic">🎙️</span>
        <span class="voice-glyph voice-spinner"></span>
        <span class="voice-glyph voice-check">✓</span>
        <span class="voice-glyph voice-query">؟</span>
      </div>
      <p id="voice-status" class="voice-status" role="status" aria-live="polite"></p>
      <p id="voice-transcript" class="voice-transcript"></p>
      <button id="voice-retry" class="voice-retry" type="button"></button>
    </div>

    <!-- Content failed to load and nothing is cached. Icon plus a tappable
         reload, so it resolves without reading. -->
    <div id="boot-error" class="boot-error" hidden>
      <span class="boot-error-icon" aria-hidden="true">📡</span>
      <button id="reload" class="boot-error-reload" type="button">
        <span aria-hidden="true">↻</span>
      </button>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
