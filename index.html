<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6e4f" />
    <title>راهنمای آلمان — Wegweiser Deutschland</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- HOME -->
    <main id="screen-home" class="screen">
      <header class="home-header">
        <p class="kicker">راهنمای صوتی · <span id="county">Freising</span></p>
        <p class="lang" id="lang-label">فارسی / دری</p>
      </header>

      <button id="mic" class="mic" aria-label="صحبت کنید">
        <span class="mic-glyph">🎙️</span>
        <span class="mic-label">صحبت کنید</span>
      </button>

      <nav id="grid" class="grid" aria-label="موضوع‌ها"></nav>
    </main>

    <!-- TOPIC -->
    <main id="screen-topic" class="screen" hidden>
      <header class="topic-bar">
        <button id="back" class="btn-back" aria-label="بازگشت">→</button>
      </header>
      <div id="topic-content"></div>
    </main>

    <!-- VOICE OVERLAY -->
    <div id="voice-overlay" class="voice-overlay" hidden data-state="listening">
      <button id="voice-close" class="voice-close" aria-label="بستن">✕</button>
      <div class="voice-stage" aria-hidden="true">
        <span class="voice-glyph voice-glyph-mic">🎙️</span>
        <span class="voice-glyph voice-glyph-spinner"></span>
        <span class="voice-glyph voice-glyph-check">✓</span>
        <span class="voice-glyph voice-glyph-q">؟</span>
      </div>
      <p id="voice-status" class="voice-status">در حال شنیدن…</p>
      <p id="voice-transcript" class="voice-transcript"></p>
      <button id="voice-retry" class="voice-retry">🎙️ دوباره صحبت کنید</button>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
